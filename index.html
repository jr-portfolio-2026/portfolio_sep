<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enter Meridian, a portfolio at the intersection of engineering, data, international trade and law.">
  <meta name="theme-color" content="#f3eadc">
  <title>Meridian | Welcome</title>
  <link rel="stylesheet" href="assets/css/intro.css">
</head>
<body>
  <div class="surface" aria-hidden="true"></div>
  <div class="top-rule" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="stage__meta" aria-hidden="true">
      <span>Portfolio system / 2026</span>
      <span>48.8566 N &nbsp; 02.3522 E</span>
    </div>
    <section class="stage__center" aria-labelledby="welcome-title">
      <div class="meridian-mark" aria-hidden="true">
        <span class="meridian-mark__ring"></span>
        <span class="meridian-mark__axis"></span>
        <span class="meridian-mark__latitude"></span>
        <span class="meridian-mark__point"></span>
      </div>
      <h1 class="brand-name" id="welcome-title">Mer<em>i</em>dian</h1>
      <p class="statement">Systems for a world without simple borders.</p>
      <span class="divider" aria-hidden="true"></span>
      <ul class="disciplines" aria-label="Portfolio disciplines">
        <li>Engineering</li><li>Data</li><li>International trade</li><li>Law</li>
      </ul>
      <button class="enter" id="enter" type="button">Enter portfolio <span aria-hidden="true">&#8599;</span></button>
    </section>
    <div class="stage__footer" aria-hidden="true">
      <span>Research-led digital practice</span>
      <div class="sequence-track"><i></i></div>
      <span>EN / FR / UK</span>
    </div>
  </main>

  <button class="skip" id="skip" type="button">Skip introduction</button>
  <div class="transition-screen" id="transition" aria-live="polite"><span>Welcome.</span></div>
  <noscript><p class="noscript">JavaScript is disabled. <a href="home.html">Enter the portfolio directly.</a></p></noscript>
  <script src="assets/js/intro.js"></script>
</body>
</html>
