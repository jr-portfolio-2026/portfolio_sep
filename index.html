<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Enter J.R's portfolio across software engineering, data, international trade and law.">
  <meta name="theme-color" content="#eee4d3">
  <title>J.R | Portfolio</title>
  <link rel="stylesheet" href="assets/css/intro.css">
</head>
<body>
  <div class="ivory-surface" aria-hidden="true"></div>

  <main class="loader" id="loader">
    <header class="loader__header">
      <p class="wordmark">J.R / Portfolio</p>
      <p>2026</p>
    </header>

    <section class="loader__center" aria-labelledby="loader-title">
      <p class="loader__eyebrow">Software · Data · Trade · Law</p>

      <button class="monogram" id="enter" type="button" aria-describedby="loader-instruction">
        <span class="monogram__stage" aria-hidden="true">
          <span class="monogram__echo monogram__echo--mist">J.R</span>
          <span class="monogram__echo monogram__echo--gold">J.R</span>
          <span class="monogram__echo monogram__echo--green">J.R</span>
          <span class="monogram__base">J.R</span>
          <span class="monogram__flare">J.R</span>
        </span>
        <span class="sr-only" id="loader-title">J.R portfolio</span>
      </button>

      <div class="loader__status">
        <p id="loader-instruction">Enter portfolio</p>
        <div class="progress" aria-hidden="true"><i></i></div>
        <p class="progress-value" aria-hidden="true"><span id="progress-value">00</span> / 100</p>
      </div>
    </section>

    <footer class="loader__footer">
      <p>International perspective</p>
      <p>EN / FR / UK</p>
    </footer>
  </main>

  <div class="page-transition" id="page-transition" aria-hidden="true"></div>
  <p class="sr-only" id="status" aria-live="polite">Select J.R to enter the portfolio.</p>
  <noscript><p class="noscript">JavaScript is unavailable. <a href="home.html">Enter the portfolio</a>.</p></noscript>
  <script src="assets/js/intro.js"></script>
</body>
</html>
